name: CI

# 측정용 임시 워크플로(머지하지 않는다, #109): Starter의 npm install과 node_modules 복사 시간만 잰다.
on:
  pull_request:

jobs:
  measure-copy:
    name: Measure node_modules copy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: .github/measure-copy.sh
