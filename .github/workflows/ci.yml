name: CI

on:
  pull_request:
  push:
    branches: [master]
  # 릴리스 워크플로(release.yml)가 npm에 배포하기 전에 같은 검사를 부른다.
  workflow_call:

jobs:
  harness:
    name: Typecheck and harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # 하네스가 만든 Starter는 Storybook 테스트와 E2E에 Chromium을 쓴다.
      # 브라우저는 Starter의 `npm run playwright:install`이 받고, 여기서는 캐시와 시스템 라이브러리만 준비한다.
      - name: Read the Playwright version of the Base
        id: playwright
        run: echo "version=$(node -p "require('./packages/devc-frontend-generator/base/package.json').devDependencies.playwright")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium system dependencies
        run: npx --yes playwright@${{ steps.playwright.outputs.version }} install-deps chromium
      - run: npm run typecheck
      # docker Recipe의 이미지 검사(harness/docker.test.ts)는 아래 docker 잡이 따로 돌린다. 같은 러너에서 컨테이너를 띄우는 동안
      # 막 시작한 Storybook 테스트의 브라우저가 setup 모듈을 불러오지 못하는 일이 있었다(#88).
      - run: npm test -- --exclude harness/docker.test.ts

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # 이미지로 띄운 Starter에 E2E를 돌리므로 harness 잡처럼 Chromium을 준비한다.
      - name: Read the Playwright version of the Base
        id: playwright
        run: echo "version=$(node -p "require('./packages/devc-frontend-generator/base/package.json').devDependencies.playwright")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium system dependencies
        run: npx --yes playwright@${{ steps.playwright.outputs.version }} install-deps chromium
      - run: npx vitest run harness/docker.test.ts

  showcase:
    name: Showcase drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Showcase(apps/showcase)는 Base와 Recipe로 생성해 커밋한다(ADR-0002). 다시 만든 결과가 커밋된 Showcase와 다르면
      # 다른 파일을 알리고 실패한다. 커밋된 Showcase가 설치·빌드·테스트를 통과하는지는 harness 잡이 본다
      # (harness/showcase.test.ts가 같은 결과인지, harness/showcase-starter.test.ts가 Starter의 모든 스크립트를).
      - run: npm run showcase:check
