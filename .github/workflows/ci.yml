name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  harness:
    name: Typecheck and harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
