name: CI

on:
  pull_request:
  push:
    branches: [master]
  # 릴리스 워크플로(release.yml)가 npm에 배포하기 전에 같은 검사를 부른다.
  workflow_call:

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  # 하네스 파일을 모두 더하면 러너 한 대에서 한 시간쯤 걸린다. 파일을 다섯 묶음으로 나눠 러너 다섯 대에서 동시에 돌린다(#103).
  # 묶음은 Vitest가 파일별 소요 시간 기록(harness/durations.json)으로 나누므로, 하네스 파일을 더하거나 빼도 이 잡을 고치지 않는다.
  harness-shard:
    name: Harness (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    strategy:
      # 한 묶음이 실패해도 나머지를 끝까지 돌려 실패한 테스트를 한 번에 모두 보인다.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # 하네스가 만든 Starter는 Storybook 테스트와 E2E에 Chromium을 쓴다.
      # 브라우저는 Starter의 `npm run playwright:install`이 받고, 여기서는 캐시와 시스템 라이브러리만 준비한다.
      - name: Read the Playwright version of the Base
        id: playwright
        run: echo "version=$(node -p "require('./packages/devc-frontend-generator/base/package.json').devDependencies.playwright")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # 시스템 라이브러리를 설치할 때 apt가 Ubuntu 미러에서 받는 .deb(글꼴 패키지 등 약 26MB)도 캐시한다. 미러가 느려지면 이것만
      # 받는 데 6~10분 걸렸다(#107). 받을 패키지와 버전은 러너 이미지에 깔린 패키지와 Playwright 버전에 따라 달라지므로 둘을 키에
      # 넣는다. 둘 중 하나가 바뀌면 같은 Ubuntu(ImageOS)의 앞선 캐시를 받아 바뀐 패키지만 미러에서 받고 새 키로 저장한다.
      # ImageOS와 ImageVersion은 env 컨텍스트에 없는 러너의 환경 변수라 셸에서 읽는다.
      - name: Read the runner image
        id: runner-image
        run: |
          echo "os=$ImageOS" >> "$GITHUB_OUTPUT"
          echo "version=$ImageVersion" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/apt-archives
          key: chromium-deps-${{ steps.runner-image.outputs.os }}-${{ steps.runner-image.outputs.version }}-playwright-${{ steps.playwright.outputs.version }}
          restore-keys: chromium-deps-${{ steps.runner-image.outputs.os }}-
      # apt-get은 받은 .deb를 /var/cache/apt/archives에 남기고, 같은 버전의 .deb가 그곳에 있으면 미러에서 받지 않는다. 그 디렉터리는
      # root만 쓸 수 있어 캐시가 직접 풀고 묶지 못하므로 캐시 디렉터리와 오가며 복사한다. 미러에 더는 없는 옛 버전은 autoclean으로
      # 지워 캐시가 불어나지 않게 한다.
      - name: Install Chromium system dependencies
        run: |
          mkdir -p ~/.cache/apt-archives
          sudo cp -r ~/.cache/apt-archives/. /var/cache/apt/archives/
          npx --yes playwright@${{ steps.playwright.outputs.version }} install-deps chromium
          sudo apt-get autoclean
          rm -f ~/.cache/apt-archives/*.deb
          find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -exec cp -t ~/.cache/apt-archives {} +
      # docker Recipe의 이미지 검사(harness/docker.test.ts)는 아래 docker 잡이 따로 돌린다. 같은 러너에서 컨테이너를 띄우는 동안
      # 막 시작한 Storybook 테스트의 브라우저가 setup 모듈을 불러오지 못하는 일이 있었다(#88).
      - run: npm test -- --exclude harness/docker.test.ts --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  # master ruleset이 필수 status check로 받는 이름이다. 타입 검사와 하네스 묶음이 모두 통과해야 통과한다.
  # 앞의 잡이 실패하면 이 잡이 건너뛰어지고, 건너뛴 필수 check는 통과로 치므로 always()로 늘 돌려 결과를 직접 확인한다.
  harness:
    name: Typecheck and harness
    needs: [typecheck, harness-shard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check that the typecheck and every harness shard passed
        env:
          TYPECHECK: ${{ needs.typecheck.result }}
          HARNESS: ${{ needs.harness-shard.result }}
        run: |
          echo "Typecheck: $TYPECHECK, Harness: $HARNESS"
          [[ "$TYPECHECK" == success && "$HARNESS" == success ]]

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # 이미지로 띄운 Starter에 E2E를 돌리므로 harness 잡처럼 Chromium을 준비한다.
      - name: Read the Playwright version of the Base
        id: playwright
        run: echo "version=$(node -p "require('./packages/devc-frontend-generator/base/package.json').devDependencies.playwright")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Read the runner image
        id: runner-image
        run: |
          echo "os=$ImageOS" >> "$GITHUB_OUTPUT"
          echo "version=$ImageVersion" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/apt-archives
          key: chromium-deps-${{ steps.runner-image.outputs.os }}-${{ steps.runner-image.outputs.version }}-playwright-${{ steps.playwright.outputs.version }}
          restore-keys: chromium-deps-${{ steps.runner-image.outputs.os }}-
      - name: Install Chromium system dependencies
        run: |
          mkdir -p ~/.cache/apt-archives
          sudo cp -r ~/.cache/apt-archives/. /var/cache/apt/archives/
          npx --yes playwright@${{ steps.playwright.outputs.version }} install-deps chromium
          sudo apt-get autoclean
          rm -f ~/.cache/apt-archives/*.deb
          find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -exec cp -t ~/.cache/apt-archives {} +
      - run: npx vitest run harness/docker.test.ts

  showcase:
    name: Showcase drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Showcase(apps/showcase)는 Base와 Recipe로 생성해 커밋한다(ADR-0002). 다시 만든 결과가 커밋된 Showcase와 다르면
      # 다른 파일을 알리고 실패한다. 커밋된 Showcase가 설치·빌드·테스트를 통과하는지는 harness 잡이 본다
      # (harness/showcase.test.ts가 같은 결과인지, harness/showcase-starter.test.ts가 Starter의 모든 스크립트를).
      - run: npm run showcase:check
