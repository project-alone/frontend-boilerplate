# 생성된 Showcase 파일이니 직접 고치지 마세요. 원본을 고친 뒤 레포 최상위에서 npm run showcase로 다시 만듭니다.
# 원본(packages/devc-frontend-generator/): base/openapi.yaml, recipes/auth/openapi.yaml, recipes/chart/openapi.yaml, recipes/file-upload/openapi.yaml, recipes/infinite-list/openapi.yaml, recipes/multi-step-form/openapi.yaml, recipes/optimistic-update/openapi.yaml, recipes/realtime/openapi.yaml, recipes/table/openapi.yaml

# API 계층의 원본이 되는 OpenAPI 명세. `npm run api:gen`이 이 파일에서 src/shared/api/generated를 다시 만든다.
# 지금 내용은 API 계층이 어떻게 이어지는지 보여 주는 가상의 샘플이다. 실제 프로젝트에서는 백엔드의 명세로 바꾼다(README의 "API 계층").
openapi: 3.1.0
info:
  title: Sample API
  version: 0.1.0
servers:
  - url: https://api.example.com
tags:
  - name: products
    description: 상품
  - name: auth
    description: 인증
  - name: stats
    description: 대시보드 통계
  - name: files
    description: 파일
  - name: articles
    description: 게시글
  - name: partners
    description: 입점 파트너
  - name: todos
    description: 할 일
  - name: deliveries
    description: 배송
  - name: members
    description: 회원
paths:
  /products:
    get:
      operationId: listProducts
      summary: 상품 목록
      tags: [products]
      parameters:
        - name: q
          in: query
          description: 상품 이름 검색어
          required: false
          schema:
            type: string
      responses:
        '200':
          description: 상품 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
              # MSW 목이 돌려주는 값. example이 없으면 faker가 실행할 때마다 다른 값을 만든다.
              example:
                - id: 1
                  name: 기본 티셔츠
                  price: 19000
                - id: 2
                  name: 데님 재킷
                  price: 89000
    post:
      operationId: createProduct
      summary: 상품 등록
      tags: [products]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewProduct'
      responses:
        '201':
          description: 등록된 상품
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
              example:
                id: 3
                name: 울 니트
                price: 59000
  /auth/login:
    post:
      operationId: login
      summary: 로그인
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 발급한 토큰
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
              example:
                accessToken: sample-access-token
                refreshToken: sample-refresh-token
                expiresIn: 3600
        '401':
          description: 이메일이나 비밀번호가 맞지 않음
  /auth/refresh:
    post:
      operationId: refreshTokens
      summary: 토큰 재발급
      description: refreshToken으로 새 토큰을 발급한다. 쓴 refreshToken은 더 쓸 수 없다(rotation).
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: 새로 발급한 토큰
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
              example:
                accessToken: sample-refreshed-access-token
                refreshToken: sample-refreshed-refresh-token
                expiresIn: 3600
        '401':
          description: refreshToken이 만료되었거나 이미 쓰였음
  /auth/me:
    get:
      operationId: getMe
      summary: 로그인한 사용자
      tags: [auth]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: accessToken의 사용자
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: 1
                email: user@example.com
                name: 김사용
                roles: [user]
        '401':
          description: accessToken이 없거나 만료됨
  /auth/logout:
    post:
      operationId: logout
      summary: 로그아웃
      description: refreshToken을 더 쓸 수 없게 한다.
      tags: [auth]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204':
          description: 로그아웃함
  # chart Recipe가 더한 operation. 샘플 차트(src/features/stats-charts)가 시계열 차트와 비교 차트로 그린다.
  /stats/daily-visits:
    get:
      operationId: listDailyVisits
      summary: 최근 14일의 일별 방문 수
      tags: [stats]
      responses:
        '200':
          description: 날짜 오름차순의 일별 방문 수
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DailyVisits'
              # MSW 목이 늘 같은 값을 돌려주도록 example을 적는다.
              example:
                - date: '2026-10-01'
                  visits: 1320
                - date: '2026-10-02'
                  visits: 1410
                - date: '2026-10-03'
                  visits: 980
                - date: '2026-10-04'
                  visits: 910
                - date: '2026-10-05'
                  visits: 1250
                - date: '2026-10-06'
                  visits: 1380
                - date: '2026-10-07'
                  visits: 1460
                - date: '2026-10-08'
                  visits: 1520
                - date: '2026-10-09'
                  visits: 1590
                - date: '2026-10-10'
                  visits: 1040
                - date: '2026-10-11'
                  visits: 960
                - date: '2026-10-12'
                  visits: 1430
                - date: '2026-10-13'
                  visits: 1610
                - date: '2026-10-14'
                  visits: 1680
  /stats/channel-sales:
    get:
      operationId: listChannelSales
      summary: 판매 채널별 이번 달과 지난달 매출
      tags: [stats]
      responses:
        '200':
          description: 판매 채널별 매출
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChannelSales'
              example:
                - channel: 온라인 스토어
                  currentMonth: 48200000
                  previousMonth: 41500000
                - channel: 모바일 앱
                  currentMonth: 36900000
                  previousMonth: 38100000
                - channel: 오프라인 매장
                  currentMonth: 22400000
                  previousMonth: 25800000
                - channel: 제휴 마켓
                  currentMonth: 12700000
                  previousMonth: 9300000
  /files:
    post:
      operationId: uploadFile
      summary: 파일 업로드
      description: >-
        파일 하나를 multipart/form-data의 file 필드로 받는다. 5MB(5,242,880바이트) 이하의 PNG, JPEG, PDF, 텍스트 파일만 받고, 더 크면 413, 다른 형식이면 415로 거절한다.
      tags: [files]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FileUpload'
            encoding:
              file:
                # 받는 형식. 업로더의 기준(src/shared/upload/upload-policy.ts)과 같아야 한다(upload-policy.test.ts).
                contentType: image/png, image/jpeg, application/pdf, text/plain
      responses:
        '201':
          description: 받은 파일
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadedFile'
              # 생성된 MSW 핸들러가 돌려주는 값. 개발·테스트에서는 file-upload Recipe의 핸들러(src/shared/mocks/files.ts)가
              # 올린 파일의 이름·크기·형식을 담아 대신 답한다.
              example:
                id: file-1
                name: report.pdf
                size: 1024
                contentType: application/pdf
        '400':
          description: file 필드에 파일이 없다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadError'
              example:
                message: multipart/form-data의 file 필드에 파일을 담아 보내 주세요.
        '413':
          description: 파일이 5MB보다 크다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadError'
              example:
                message: 5MB 이하의 파일만 올릴 수 있습니다.
        '415':
          description: 받지 않는 형식이다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadError'
              example:
                message: PNG, JPEG, PDF, 텍스트 파일만 올릴 수 있습니다.
  /articles:
    get:
      operationId: listArticles
      summary: 게시글 목록
      description: 최근에 올린 글부터 한 페이지를 돌려준다. 마지막 페이지 뒤의 페이지를 요청하면 빈 배열을 돌려준다.
      tags: [articles]
      parameters:
        - name: page
          in: query
          description: 1부터 세는 페이지 번호
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          description: 한 페이지의 게시글 수
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        '200':
          description: 게시글 한 페이지. 마지막 페이지 뒤이면 빈 배열이다.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Article'
              # 생성된 MSW 핸들러가 돌려주는 값. 개발·테스트에서는 infinite-list Recipe의 핸들러
              # (src/shared/mocks/articles.ts)가 페이지 번호대로 나눈 페이지를 대신 돌려준다.
              example:
                - id: 46
                  title: 릴리스 노트 46호
                  summary: 2024년 11월 13일에 올린 릴리스 노트입니다.
                  publishedAt: '2024-11-13'
                - id: 45
                  title: 개발 블로그 45호
                  summary: 2024년 11월 6일에 올린 개발 블로그입니다.
                  publishedAt: '2024-11-06'
        '400':
          description: 파라미터가 잘못되었다.
  /articles/count:
    get:
      operationId: countArticles
      summary: 게시글 수
      description: 전체 게시글 수를 돌려준다. 번호형 페이지네이션이 페이지 수를 정할 때 쓴다.
      tags: [articles]
      responses:
        '200':
          description: 전체 게시글 수
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleCount'
              example:
                total: 46
  /partner-applications:
    post:
      operationId: submitPartnerApplication
      summary: 입점 신청
      description: 사업자 정보, 담당자 정보, 판매 계획을 한 번에 받아 입점 신청을 접수한다.
      tags: [partners]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerApplication'
      responses:
        '201':
          description: 접수한 입점 신청
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerApplicationReceipt'
              # 생성된 MSW 핸들러가 돌려주는 값
              example:
                id: PA-0001
        '400':
          description: 요청 본문이 잘못되었다.
  /todos:
    get:
      operationId: listTodos
      summary: 할 일 목록
      description: 할 일을 만든 순서(id 오름차순)로 모두 돌려준다.
      tags: [todos]
      responses:
        '200':
          description: 할 일 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Todo'
              # 생성된 MSW 핸들러가 돌려주는 값. 개발·테스트에서는 optimistic-update Recipe의 핸들러(src/shared/mocks/todos.ts)가
              # 바뀐 완료 여부를 기억해 대신 돌려준다.
              example:
                - id: 1
                  title: 디자인 시안 검토하기
                  done: true
                - id: 2
                  title: 회의록 공유하기
                  done: false
                - id: 3
                  title: 배포 일정 정하기
                  done: false
                - id: 4
                  title: 보안 점검 결과 승인하기(보안 담당자만 바꿀 수 있음)
                  done: false
  /todos/{todoId}:
    patch:
      operationId: updateTodo
      summary: 할 일 고치기
      description: 보낸 항목만 바꾸고 바뀐 할 일을 돌려준다. 바꿀 권한이 없는 할 일이면 403으로 거절한다.
      tags: [todos]
      parameters:
        - name: todoId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TodoUpdate'
      responses:
        '200':
          description: 바뀐 할 일
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
              example:
                id: 2
                title: 회의록 공유하기
                done: true
        '400':
          description: 요청 본문이 잘못되었다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoError'
        '403':
          description: 이 할 일을 바꿀 권한이 없다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoError'
              example:
                message: 보안 점검 결과는 보안 담당자만 승인할 수 있습니다.
        '404':
          description: 할 일이 없다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoError'
  /deliveries:
    get:
      operationId: listDeliveries
      summary: 배송 현황
      description: 최근에 접수한 배송부터 돌려준다.
      tags: [deliveries]
      responses:
        '200':
          description: 최근에 접수한 순서의 배송 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Delivery'
              # 생성된 MSW 핸들러가 돌려주는 값. 개발·테스트에서는 realtime Recipe의 목 백엔드(src/shared/mocks/deliveries.ts)가
              # 이벤트로 바뀐 목록을 대신 돌려준다.
              example:
                - id: D-1003
                  recipient: 박서연
                  item: 무선 키보드
                  status: preparing
                  updatedAt: '2026-10-21T09:20:00+09:00'
                - id: D-1002
                  recipient: 이도윤
                  item: 블루투스 스피커
                  status: preparing
                  updatedAt: '2026-10-21T09:10:00+09:00'
                - id: D-1001
                  recipient: 김하늘
                  item: 무선 이어폰
                  status: shipping
                  updatedAt: '2026-10-21T09:00:00+09:00'
  /deliveries/events:
    get:
      operationId: streamDeliveryEvents
      summary: 배송 이벤트 스트림
      description: >-
        배송이 접수되거나 바뀔 때마다 그 배송을 Server-Sent Events(text/event-stream)로 보낸다. 이벤트 이름(event)은 delivery.created(접수)나 delivery.updated(변경)이고, 데이터(data)는 바뀐 뒤의 Delivery JSON, id는 이벤트 번호다. 연결하자마자 주석 한 줄(`:`)을 보내 응답을 바로 시작하고, 다시 연결할 때 받는 Last-Event-ID 헤더는 마지막으로 받은 이벤트 번호다. 이 operation은 생성된 fetch 함수 대신 src/shared/realtime/event-stream.ts가 연결한다.
      tags: [deliveries]
      responses:
        '200':
          description: 배송 이벤트 스트림
          content:
            # 이벤트 하나의 데이터는 Delivery다. OpenAPI 3.1에는 스트림의 항목마다 스키마를 적는 방법이 없고, 응답 전체에
            # 스키마를 적으면 생성된 fetch 함수가 응답을 한 번에 읽어 검증하려 하므로 비워 둔다.
            text/event-stream: {}
  /members:
    get:
      operationId: listMembers
      summary: 회원 목록
      description: 검색어와 역할로 거르고 정렬한 회원 목록의 한 페이지를 돌려준다.
      tags: [members]
      parameters:
        - name: q
          in: query
          description: 이름이나 이메일에 들어 있는 검색어. 대소문자를 가리지 않는다.
          required: false
          schema:
            type: string
        - name: role
          in: query
          description: 이 역할의 회원만 돌려준다.
          required: false
          schema:
            $ref: '#/components/schemas/MemberRole'
        - name: sort
          in: query
          description: 정렬할 항목. 없으면 가입한 순서(id 오름차순)다.
          required: false
          schema:
            type: string
            enum: [name, email, joinedAt]
        - name: order
          in: query
          description: 정렬 방향. sort가 있을 때만 쓴다.
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: asc
        - name: page
          in: query
          description: 1부터 세는 페이지 번호
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          description: 한 페이지의 회원 수
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: 회원 목록의 한 페이지
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberPage'
              # 생성된 MSW 핸들러가 돌려주는 값. 개발·테스트에서는 table Recipe의 핸들러(src/shared/mocks/members.ts)가
              # 파라미터대로 정렬·필터한 결과를 대신 돌려준다.
              example:
                items:
                  - id: 1
                    name: 김하늘
                    email: haneul.kim@example.com
                    role: admin
                    joinedAt: '2024-01-08'
                  - id: 2
                    name: 이도윤
                    email: doyun.lee@example.com
                    role: editor
                    joinedAt: '2024-02-14'
                total: 2
                page: 1
                pageSize: 10
        '400':
          description: 파라미터가 잘못되었다.
components:
  schemas:
    Product:
      type: object
      required: [id, name, price]
      properties:
        id:
          type: integer
        name:
          type: string
        price:
          type: integer
          description: 원 단위 가격
    NewProduct:
      type: object
      required: [name, price]
      properties:
        name:
          type: string
          minLength: 1
        price:
          type: integer
          minimum: 0
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          title: 이메일
        password:
          type: string
          minLength: 1
          title: 비밀번호
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    LogoutRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    TokenPair:
      type: object
      required: [accessToken, refreshToken, expiresIn]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
          minimum: 0
          description: accessToken이 만료되기까지 남은 초
    Role:
      type: string
      enum: [admin, user]
      description: 사용자의 역할. 보호된 라우트의 접근 규칙(src/shared/auth/access-rules.ts)이 쓴다.
    User:
      type: object
      required: [id, email, name, roles]
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        name:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
    DailyVisits:
      type: object
      required: [date, visits]
      properties:
        date:
          type: string
          format: date
          description: 방문 날짜(YYYY-MM-DD)
        visits:
          type: integer
          minimum: 0
          description: 그날의 방문 수
    ChannelSales:
      type: object
      required: [channel, currentMonth, previousMonth]
      properties:
        channel:
          type: string
          description: 판매 채널 이름
        currentMonth:
          type: integer
          minimum: 0
          description: 이번 달 매출(원)
        previousMonth:
          type: integer
          minimum: 0
          description: 지난달 매출(원)
    FileUpload:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
          description: 올릴 파일. 5MB(5,242,880바이트)까지 받는다.
          # 받는 가장 큰 크기(바이트). OpenAPI에는 파일 크기를 적는 표기가 없어 확장 필드로 적는다(maxLength는 글자 수이고,
          # orval이 파일 스키마에 맞지 않는 Zod 검사를 만든다). 업로더의 기준과 같아야 한다(upload-policy.test.ts).
          x-max-bytes: 5242880
    UploadedFile:
      type: object
      required: [id, name, size, contentType]
      properties:
        id:
          type: string
        name:
          type: string
          description: 올린 파일의 이름
        size:
          type: integer
          description: 바이트 단위 크기
        contentType:
          type: string
          description: 파일의 형식(MIME 타입)
    UploadError:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: 사용자에게 보여 줄 거절 이유
    Article:
      type: object
      required: [id, title, summary, publishedAt]
      properties:
        id:
          type: integer
        title:
          type: string
        summary:
          type: string
        publishedAt:
          type: string
          format: date
          description: 올린 날(YYYY-MM-DD)
    ArticleCount:
      type: object
      required: [total]
      properties:
        total:
          type: integer
          minimum: 0
    PartnerCategory:
      type: string
      enum: [fashion, food, living, digital]
    PartnerApplication:
      type: object
      required: [companyName, businessNumber, category, contactName, email, phone, productCount, agreedToTerms]
      properties:
        # 1단계: 사업자 정보
        companyName:
          type: string
          title: 상호
          minLength: 1
          maxLength: 50
        businessNumber:
          type: string
          title: 사업자등록번호
          description: 000-00-00000 형식으로 적습니다.
          pattern: '^\d{3}-\d{2}-\d{5}$'
        category:
          $ref: '#/components/schemas/PartnerCategory'
          title: 판매 분야
        # 2단계: 담당자 정보
        contactName:
          type: string
          title: 담당자 이름
          minLength: 1
          maxLength: 20
        email:
          type: string
          format: email
          title: 이메일
        phone:
          type: string
          title: 연락처
          description: 010-0000-0000 형식으로 적습니다.
          pattern: '^01\d-\d{3,4}-\d{4}$'
        # 3단계: 판매 계획
        productCount:
          type: integer
          title: 판매할 상품 수
          minimum: 1
          maximum: 10000
        monthlySales:
          type: integer
          title: 월 예상 매출(만 원)
          minimum: 0
        introduction:
          type: string
          title: 회사 소개
          maxLength: 200
        agreedToTerms:
          type: boolean
          title: 입점 약관에 동의합니다
          const: true
    PartnerApplicationReceipt:
      type: object
      required: [id]
      properties:
        id:
          type: string
          description: 접수 번호
    Todo:
      type: object
      required: [id, title, done]
      properties:
        id:
          type: integer
        title:
          type: string
        done:
          type: boolean
          description: 끝냈는지
    TodoUpdate:
      type: object
      required: [done]
      properties:
        done:
          type: boolean
          description: 끝냈는지
    TodoError:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: 사람이 읽을 수 있는 실패 이유
    DeliveryStatus:
      type: string
      enum: [preparing, shipping, delivered]
      description: 상품 준비 중(preparing), 배송 중(shipping), 배송 완료(delivered)
    Delivery:
      type: object
      required: [id, recipient, item, status, updatedAt]
      properties:
        id:
          type: string
          description: 운송장 번호
        recipient:
          type: string
          description: 받는 사람
        item:
          type: string
          description: 보내는 상품
        status:
          $ref: '#/components/schemas/DeliveryStatus'
        updatedAt:
          type: string
          format: date-time
          description: 마지막으로 바뀐 시각. 이보다 오래된 이벤트는 캐시에 반영하지 않는다.
    MemberRole:
      type: string
      enum: [admin, editor, viewer]
    Member:
      type: object
      required: [id, name, email, role, joinedAt]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          $ref: '#/components/schemas/MemberRole'
        joinedAt:
          type: string
          format: date
          description: 가입일(YYYY-MM-DD)
    MemberPage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Member'
        total:
          type: integer
          description: 거른 뒤의 전체 회원 수
        page:
          type: integer
        pageSize:
          type: integer
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
