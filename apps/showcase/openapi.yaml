              schema:
                $ref: '#/components/schemas/ShopError'
        '404':
          description: 그런 주문이 없다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopError'
        '409':
          description: 이미 결제한 주문이다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopError'
  /users:
    get:
      operationId: listUsers
      summary: 사용자 목록
      description: 검색어, 역할, 상태로 거르고 정렬한 사용자 목록의 한 페이지를 돌려준다.
      tags: [users]
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          description: 이름이나 이메일에 들어 있는 검색어. 대소문자를 가리지 않는다.
          required: false
          schema:
            type: string
        - name: role
          in: query
          description: 이 역할의 사용자만 돌려준다.
          required: false
          schema:
            $ref: '#/components/schemas/Role'
        - name: status
          in: query
          description: 이 상태의 사용자만 돌려준다.
          required: false
          schema:
            $ref: '#/components/schemas/UserStatus'
        - name: sort
          in: query
          description: 정렬할 항목. 없으면 최근에 추가한 사용자부터(id 내림차순)다.
          required: false
          schema:
            type: string
            enum: [name, email, joinedAt]
        - name: order
          in: query
          description: 정렬 방향. sort가 있을 때만 쓴다.
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: asc
        - name: page
          in: query
          description: 1부터 세는 페이지 번호
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          description: 한 페이지의 사용자 수
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: 사용자 목록의 한 페이지
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAccountPage'
              # 생성된 MSW 핸들러가 돌려주는 값. 개발·테스트에서는 대시보드의 핸들러(src/shared/mocks/users.ts)가
              # 추가·수정한 사용자를 기억하고 파라미터대로 정렬·필터한 결과를 대신 돌려준다.
              example:
                items:
                  - id: 2
                    name: 박관리
                    email: admin@example.com
                    role: admin
                    status: active
                    department: 운영팀
                    joinedAt: '2025-03-02'
                  - id: 1
                    name: 김사용
                    email: user@example.com
                    role: user
                    status: active
                    joinedAt: '2025-01-15'
                total: 2
                page: 1
                pageSize: 10
        '401':
          description: 로그인하지 않았거나 accessToken이 만료되었다.
    post:
      operationId: createUser
      summary: 사용자 추가
      description: 사용자를 초대한다. 추가한 사용자는 초대됨(invited) 상태로 시작한다. 관리자만 할 수 있다.
      tags: [users]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewUserAccount'
      responses:
        '201':
          description: 추가한 사용자
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAccount'
              example:
                id: 13
                name: 신입사
                email: newbie@example.com
                role: user
                status: invited
                joinedAt: '2026-10-21'
        '401':
          description: 로그인하지 않았거나 accessToken이 만료되었다.
        '403':
          description: 관리자가 아니다.
        '409':
          description: 같은 이메일의 사용자가 이미 있다.
  /users/stats:
    get:
      operationId: getUserStats
      summary: 사용자 통계
