# 생성된 Showcase 파일이니 직접 고치지 마세요. 원본을 고친 뒤 레포 최상위에서 npm run showcase로 다시 만듭니다.
# 원본(packages/devc-frontend-generator/): base/openapi.yaml, recipes/auth/openapi.yaml

# API 계층의 원본이 되는 OpenAPI 명세. `npm run api:gen`이 이 파일에서 src/shared/api/generated를 다시 만든다.
# 지금 내용은 API 계층이 어떻게 이어지는지 보여 주는 가상의 샘플이다. 실제 프로젝트에서는 백엔드의 명세로 바꾼다(README의 "API 계층").
openapi: 3.1.0
info:
  title: Sample API
  version: 0.1.0
servers:
  - url: https://api.example.com
tags:
  - name: products
    description: 상품
  - name: auth
    description: 인증
paths:
  /products:
    get:
      operationId: listProducts
      summary: 상품 목록
      tags: [products]
      parameters:
        - name: q
          in: query
          description: 상품 이름 검색어
          required: false
          schema:
            type: string
      responses:
        '200':
          description: 상품 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
              # MSW 목이 돌려주는 값. example이 없으면 faker가 실행할 때마다 다른 값을 만든다.
              example:
                - id: 1
                  name: 기본 티셔츠
                  price: 19000
                - id: 2
                  name: 데님 재킷
                  price: 89000
    post:
      operationId: createProduct
      summary: 상품 등록
      tags: [products]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewProduct'
      responses:
        '201':
          description: 등록된 상품
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
              example:
                id: 3
                name: 울 니트
                price: 59000
  /auth/login:
    post:
      operationId: login
      summary: 로그인
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 발급한 토큰
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
              example:
                accessToken: sample-access-token
                refreshToken: sample-refresh-token
                expiresIn: 3600
        '401':
          description: 이메일이나 비밀번호가 맞지 않음
  /auth/refresh:
    post:
      operationId: refreshTokens
      summary: 토큰 재발급
      description: refreshToken으로 새 토큰을 발급한다. 쓴 refreshToken은 더 쓸 수 없다(rotation).
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: 새로 발급한 토큰
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
              example:
                accessToken: sample-refreshed-access-token
                refreshToken: sample-refreshed-refresh-token
                expiresIn: 3600
        '401':
          description: refreshToken이 만료되었거나 이미 쓰였음
  /auth/me:
    get:
      operationId: getMe
      summary: 로그인한 사용자
      tags: [auth]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: accessToken의 사용자
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: 1
                email: user@example.com
                name: 김사용
                roles: [user]
        '401':
          description: accessToken이 없거나 만료됨
  /auth/logout:
    post:
      operationId: logout
      summary: 로그아웃
      description: refreshToken을 더 쓸 수 없게 한다.
      tags: [auth]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204':
          description: 로그아웃함
components:
  schemas:
    Product:
      type: object
      required: [id, name, price]
      properties:
        id:
          type: integer
        name:
          type: string
        price:
          type: integer
          description: 원 단위 가격
    NewProduct:
      type: object
      required: [name, price]
      properties:
        name:
          type: string
          minLength: 1
        price:
          type: integer
          minimum: 0
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          title: 이메일
        password:
          type: string
          minLength: 1
          title: 비밀번호
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    LogoutRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    TokenPair:
      type: object
      required: [accessToken, refreshToken, expiresIn]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
          minimum: 0
          description: accessToken이 만료되기까지 남은 초
    Role:
      type: string
      enum: [admin, user]
      description: 사용자의 역할. 보호된 라우트의 접근 규칙(src/shared/auth/access-rules.ts)이 쓴다.
    User:
      type: object
      required: [id, email, name, roles]
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        name:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
