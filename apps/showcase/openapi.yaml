  /carts:
    post:
      operationId: createCart
      summary: 장바구니 만들기
      description: >-
        처음 담는 상품으로 장바구니를 만든다. 로그인하지 않아도 만들 수 있고, 돌려준 id로 장바구니를 찾는다. 담으려는 수량이 남은 재고보다 많으면 409로 거절하고 장바구니를 만들지 않는다.
      tags: [cart]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewCartItem'
      responses:
        '201':
          description: 만든 장바구니
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
              example:
                id: 0b7e4c8e-5d1f-4a52-9a37-2f1c6d3e8a90
                items:
                  - productId: 1
                    name: 오가닉 코튼 티셔츠
                    price: 19000
                    quantity: 1
                totalQuantity: 1
                totalPrice: 19000
        '400':
          description: 요청 본문이 잘못되었다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopError'
        '404':
          description: 그런 상품이 없다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopError'
        '409':
          description: 남은 재고보다 많이 담으려 했다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopError'
              example:
                message: 재고가 부족합니다. 남은 수량은 2개입니다.
