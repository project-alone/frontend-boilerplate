  /orders/{orderId}/payment:
    post:
      operationId: confirmOrderPayment
      summary: 결제 확인
      description: >-
        결제창이 승인한 결제를 확인해 주문을 결제 완료(paid)로 바꾸고, 주문한 장바구니를 지운다. 결제 금액(amount)이 주문 금액과 다르면 400으로, 이미 결제한 주문이면 409로 거절한다. PG를 연동하지 않은 가짜 결제라 paymentKey는 확인하지 않는다.
      tags: [orders]
      parameters:
        - $ref: '#/components/parameters/OrderId'
