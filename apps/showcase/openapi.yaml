              schema:
                $ref: '#/components/schemas/Order'
              example:
                id: ORD-7F3A92C1D4E5
                status: paid
                items:
                  - productId: 1
                    name: 오가닉 코튼 티셔츠
                    price: 19000
                    quantity: 2
                totalQuantity: 2
                totalPrice: 38000
                recipient: 홍길동
                phone: 010-1234-5678
                postalCode: '04524'
                address: 서울특별시 중구 세종대로 110
                paymentMethod: card
        '400':
          description: 요청 본문이 잘못되었거나 결제 금액이 주문 금액과 다르다.
          content:
