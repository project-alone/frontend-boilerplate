  /orders:
    post:
      operationId: placeOrder
      summary: 주문하기
      description: >-
        장바구니에 담긴 상품을 그때의 가격으로 주문해 결제 대기(pending) 주문을 만든다. 장바구니는 결제가 끝날 때까지 그대로다. 장바구니가 비었거나 재고가 부족하면 409로 거절한다.
      tags: [orders]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewOrder'
      responses:
        '201':
          description: 만든 주문
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              example:
                id: ORD-7F3A92C1D4E5
                status: pending
                items:
                  - productId: 1
                    name: 오가닉 코튼 티셔츠
                    price: 19000
                    quantity: 2
                totalQuantity: 2
                totalPrice: 38000
                recipient: 홍길동
                phone: 010-1234-5678
                postalCode: '04524'
                address: 서울특별시 중구 세종대로 110
                paymentMethod: card
        '400':
          description: 요청 본문이 잘못되었다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopError'
        '404':
          description: 그런 장바구니가 없다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopError'
        '409':
          description: 장바구니가 비었거나 재고가 부족하다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopError'
