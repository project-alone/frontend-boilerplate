# 생성된 Showcase 파일이니 직접 고치지 마세요. 원본을 고친 뒤 레포 최상위에서 npm run showcase로 다시 만듭니다.
# 원본(packages/devc-frontend-generator/): base/openapi.yaml, recipes/chart/openapi.yaml, recipes/realtime/openapi.yaml, recipes/table/openapi.yaml

# API 계층의 원본이 되는 OpenAPI 명세. `npm run api:gen`이 이 파일에서 src/shared/api/generated를 다시 만든다.
# 지금 내용은 API 계층이 어떻게 이어지는지 보여 주는 가상의 샘플이다. 실제 프로젝트에서는 백엔드의 명세로 바꾼다(README의 "API 계층").
openapi: 3.1.0
info:
  title: Sample API
  version: 0.1.0
servers:
  - url: https://api.example.com
tags:
  - name: products
    description: 상품
  - name: stats
    description: 대시보드 통계
  - name: deliveries
    description: 배송
  - name: members
    description: 회원
paths:
  /products:
    get:
      operationId: listProducts
      summary: 상품 목록
      tags: [products]
      parameters:
        - name: q
          in: query
          description: 상품 이름 검색어
          required: false
          schema:
            type: string
      responses:
        '200':
          description: 상품 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
              # MSW 목이 돌려주는 값. example이 없으면 faker가 실행할 때마다 다른 값을 만든다.
              example:
                - id: 1
                  name: 기본 티셔츠
                  price: 19000
                - id: 2
                  name: 데님 재킷
                  price: 89000
    post:
      operationId: createProduct
      summary: 상품 등록
      tags: [products]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewProduct'
      responses:
        '201':
          description: 등록된 상품
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
              example:
                id: 3
                name: 울 니트
                price: 59000
  # chart Recipe가 더한 operation. 샘플 차트(src/features/stats-charts)가 시계열 차트와 비교 차트로 그린다.
  /stats/daily-visits:
    get:
      operationId: listDailyVisits
      summary: 최근 14일의 일별 방문 수
      tags: [stats]
      responses:
        '200':
          description: 날짜 오름차순의 일별 방문 수
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DailyVisits'
              # MSW 목이 늘 같은 값을 돌려주도록 example을 적는다.
              example:
                - date: '2026-10-01'
                  visits: 1320
                - date: '2026-10-02'
                  visits: 1410
                - date: '2026-10-03'
                  visits: 980
                - date: '2026-10-04'
                  visits: 910
                - date: '2026-10-05'
                  visits: 1250
                - date: '2026-10-06'
                  visits: 1380
                - date: '2026-10-07'
                  visits: 1460
                - date: '2026-10-08'
                  visits: 1520
                - date: '2026-10-09'
                  visits: 1590
                - date: '2026-10-10'
                  visits: 1040
                - date: '2026-10-11'
                  visits: 960
                - date: '2026-10-12'
                  visits: 1430
                - date: '2026-10-13'
                  visits: 1610
                - date: '2026-10-14'
                  visits: 1680
  /stats/channel-sales:
    get:
      operationId: listChannelSales
      summary: 판매 채널별 이번 달과 지난달 매출
      tags: [stats]
      responses:
        '200':
          description: 판매 채널별 매출
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChannelSales'
              example:
                - channel: 온라인 스토어
                  currentMonth: 48200000
                  previousMonth: 41500000
                - channel: 모바일 앱
                  currentMonth: 36900000
                  previousMonth: 38100000
                - channel: 오프라인 매장
                  currentMonth: 22400000
                  previousMonth: 25800000
                - channel: 제휴 마켓
                  currentMonth: 12700000
                  previousMonth: 9300000
  /deliveries:
    get:
      operationId: listDeliveries
      summary: 배송 현황
      description: 최근에 접수한 배송부터 돌려준다.
      tags: [deliveries]
      responses:
        '200':
          description: 최근에 접수한 순서의 배송 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Delivery'
              # 생성된 MSW 핸들러가 돌려주는 값. 개발·테스트에서는 realtime Recipe의 목 백엔드(src/shared/mocks/deliveries.ts)가
              # 이벤트로 바뀐 목록을 대신 돌려준다.
              example:
                - id: D-1003
                  recipient: 박서연
                  item: 무선 키보드
                  status: preparing
                  updatedAt: '2026-10-21T09:20:00+09:00'
                - id: D-1002
                  recipient: 이도윤
                  item: 블루투스 스피커
                  status: preparing
                  updatedAt: '2026-10-21T09:10:00+09:00'
                - id: D-1001
                  recipient: 김하늘
                  item: 무선 이어폰
                  status: shipping
                  updatedAt: '2026-10-21T09:00:00+09:00'
  /deliveries/events:
    get:
      operationId: streamDeliveryEvents
      summary: 배송 이벤트 스트림
      description: >-
        배송이 접수되거나 바뀔 때마다 그 배송을 Server-Sent Events(text/event-stream)로 보낸다. 이벤트 이름(event)은 delivery.created(접수)나 delivery.updated(변경)이고, 데이터(data)는 바뀐 뒤의 Delivery JSON, id는 이벤트 번호다. 연결하자마자 주석 한 줄(`:`)을 보내 응답을 바로 시작하고, 다시 연결할 때 받는 Last-Event-ID 헤더는 마지막으로 받은 이벤트 번호다. 이 operation은 생성된 fetch 함수 대신 src/shared/realtime/event-stream.ts가 연결한다.
      tags: [deliveries]
      responses:
        '200':
          description: 배송 이벤트 스트림
          content:
            # 이벤트 하나의 데이터는 Delivery다. OpenAPI 3.1에는 스트림의 항목마다 스키마를 적는 방법이 없고, 응답 전체에
            # 스키마를 적으면 생성된 fetch 함수가 응답을 한 번에 읽어 검증하려 하므로 비워 둔다.
            text/event-stream: {}
  /members:
    get:
      operationId: listMembers
      summary: 회원 목록
      description: 검색어와 역할로 거르고 정렬한 회원 목록의 한 페이지를 돌려준다.
      tags: [members]
      parameters:
        - name: q
          in: query
          description: 이름이나 이메일에 들어 있는 검색어. 대소문자를 가리지 않는다.
          required: false
          schema:
            type: string
        - name: role
          in: query
          description: 이 역할의 회원만 돌려준다.
          required: false
          schema:
            $ref: '#/components/schemas/MemberRole'
        - name: sort
          in: query
          description: 정렬할 항목. 없으면 가입한 순서(id 오름차순)다.
          required: false
          schema:
            type: string
            enum: [name, email, joinedAt]
        - name: order
          in: query
          description: 정렬 방향. sort가 있을 때만 쓴다.
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: asc
        - name: page
          in: query
          description: 1부터 세는 페이지 번호
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          description: 한 페이지의 회원 수
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: 회원 목록의 한 페이지
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberPage'
              # 생성된 MSW 핸들러가 돌려주는 값. 개발·테스트에서는 table Recipe의 핸들러(src/shared/mocks/members.ts)가
              # 파라미터대로 정렬·필터한 결과를 대신 돌려준다.
              example:
                items:
                  - id: 1
                    name: 김하늘
                    email: haneul.kim@example.com
                    role: admin
                    joinedAt: '2024-01-08'
                  - id: 2
                    name: 이도윤
                    email: doyun.lee@example.com
                    role: editor
                    joinedAt: '2024-02-14'
                total: 2
                page: 1
                pageSize: 10
        '400':
          description: 파라미터가 잘못되었다.
components:
  schemas:
    Product:
      type: object
      required: [id, name, price]
      properties:
        id:
          type: integer
        name:
          type: string
        price:
          type: integer
          description: 원 단위 가격
    NewProduct:
      type: object
      required: [name, price]
      properties:
        name:
          type: string
          minLength: 1
        price:
          type: integer
          minimum: 0
    DailyVisits:
      type: object
      required: [date, visits]
      properties:
        date:
          type: string
          format: date
          description: 방문 날짜(YYYY-MM-DD)
        visits:
          type: integer
          minimum: 0
          description: 그날의 방문 수
    ChannelSales:
      type: object
      required: [channel, currentMonth, previousMonth]
      properties:
        channel:
          type: string
          description: 판매 채널 이름
        currentMonth:
          type: integer
          minimum: 0
          description: 이번 달 매출(원)
        previousMonth:
          type: integer
          minimum: 0
          description: 지난달 매출(원)
    DeliveryStatus:
      type: string
      enum: [preparing, shipping, delivered]
      description: 상품 준비 중(preparing), 배송 중(shipping), 배송 완료(delivered)
    Delivery:
      type: object
      required: [id, recipient, item, status, updatedAt]
      properties:
        id:
          type: string
          description: 운송장 번호
        recipient:
          type: string
          description: 받는 사람
        item:
          type: string
          description: 보내는 상품
        status:
          $ref: '#/components/schemas/DeliveryStatus'
        updatedAt:
          type: string
          format: date-time
          description: 마지막으로 바뀐 시각. 이보다 오래된 이벤트는 캐시에 반영하지 않는다.
    MemberRole:
      type: string
      enum: [admin, editor, viewer]
    Member:
      type: object
      required: [id, name, email, role, joinedAt]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          $ref: '#/components/schemas/MemberRole'
        joinedAt:
          type: string
          format: date
          description: 가입일(YYYY-MM-DD)
    MemberPage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Member'
        total:
          type: integer
          description: 거른 뒤의 전체 회원 수
        page:
          type: integer
        pageSize:
          type: integer
