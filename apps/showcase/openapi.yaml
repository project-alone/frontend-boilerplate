      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserAccountUpdate'
      responses:
        '200':
          description: 고친 사용자
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAccount'
              example:
                id: 1
                name: 김사용
                email: user@example.com
                role: user
                status: suspended
                joinedAt: '2025-01-15'
        '401':
          description: 로그인하지 않았거나 accessToken이 만료되었다.
        '403':
          description: 관리자가 아니다.
        '404':
          description: 그런 사용자가 없다.
        '409':
          description: 같은 이메일의 다른 사용자가 이미 있다.
components:
  schemas:
    Product:
      type: object
      required: [id, name, price]
      properties:
        id:
          type: integer
        name:
          type: string
        price:
          type: integer
          description: 원 단위 가격
    NewProduct:
      type: object
      required: [name, price]
      properties:
        name:
          type: string
          minLength: 1
        price:
          type: integer
          minimum: 0
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          title: 이메일
        password:
          type: string
          minLength: 1
          title: 비밀번호
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    LogoutRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    TokenPair:
      type: object
      required: [accessToken, refreshToken, expiresIn]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
          minimum: 0
          description: accessToken이 만료되기까지 남은 초
    Role:
      type: string
      enum: [admin, user]
      description: 사용자의 역할. 보호된 라우트의 접근 규칙(src/shared/auth/access-rules.ts)이 쓴다.
    User:
      type: object
      required: [id, email, name, roles]
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        name:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
    DailyVisits:
      type: object
      required: [date, visits]
      properties:
        date:
          type: string
          format: date
          description: 방문 날짜(YYYY-MM-DD)
        visits:
          type: integer
          minimum: 0
          description: 그날의 방문 수
    ChannelSales:
      type: object
      required: [channel, currentMonth, previousMonth]
      properties:
        channel:
          type: string
          description: 판매 채널 이름
        currentMonth:
          type: integer
          minimum: 0
          description: 이번 달 매출(원)
        previousMonth:
          type: integer
          minimum: 0
          description: 지난달 매출(원)
    FileUpload:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
          description: 올릴 파일. 5MB(5,242,880바이트)까지 받는다.
          # 받는 가장 큰 크기(바이트). OpenAPI에는 파일 크기를 적는 표기가 없어 확장 필드로 적는다(maxLength는 글자 수이고,
          # orval이 파일 스키마에 맞지 않는 Zod 검사를 만든다). 업로더의 기준과 같아야 한다(upload-policy.test.ts).
          x-max-bytes: 5242880
    UploadedFile:
      type: object
      required: [id, name, size, contentType]
      properties:
        id:
          type: string
        name:
          type: string
          description: 올린 파일의 이름
        size:
          type: integer
          description: 바이트 단위 크기
        contentType:
          type: string
          description: 파일의 형식(MIME 타입)
    UploadError:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: 사용자에게 보여 줄 거절 이유
    Article:
      type: object
      required: [id, title, summary, publishedAt]
      properties:
        id:
          type: integer
        title:
          type: string
        summary:
          type: string
        publishedAt:
          type: string
          format: date
          description: 올린 날(YYYY-MM-DD)
    ArticleCount:
      type: object
      required: [total]
      properties:
        total:
          type: integer
          minimum: 0
    PartnerCategory:
      type: string
      enum: [fashion, food, living, digital]
    PartnerApplication:
      type: object
      required: [companyName, businessNumber, category, contactName, email, phone, productCount, agreedToTerms]
      properties:
        # 1단계: 사업자 정보
        companyName:
          type: string
          title: 상호
          minLength: 1
          maxLength: 50
        businessNumber:
          type: string
          title: 사업자등록번호
          description: 000-00-00000 형식으로 적습니다.
          pattern: '^\d{3}-\d{2}-\d{5}$'
        category:
          $ref: '#/components/schemas/PartnerCategory'
          title: 판매 분야
        # 2단계: 담당자 정보
        contactName:
          type: string
          title: 담당자 이름
          minLength: 1
          maxLength: 20
        email:
          type: string
          format: email
          title: 이메일
        phone:
          type: string
          title: 연락처
          description: 010-0000-0000 형식으로 적습니다.
          pattern: '^01\d-\d{3,4}-\d{4}$'
        # 3단계: 판매 계획
        productCount:
          type: integer
          title: 판매할 상품 수
          minimum: 1
          maximum: 10000
        monthlySales:
          type: integer
          title: 월 예상 매출(만 원)
          minimum: 0
        introduction:
          type: string
          title: 회사 소개
          maxLength: 200
        agreedToTerms:
          type: boolean
          title: 입점 약관에 동의합니다
          const: true
    PartnerApplicationReceipt:
      type: object
      required: [id]
      properties:
        id:
          type: string
          description: 접수 번호
    Todo:
      type: object
      required: [id, title, done]
      properties:
        id:
          type: integer
        title:
          type: string
        done:
          type: boolean
          description: 끝냈는지
    TodoUpdate:
      type: object
      required: [done]
      properties:
        done:
          type: boolean
          description: 끝냈는지
    TodoError:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: 사람이 읽을 수 있는 실패 이유
    DeliveryStatus:
      type: string
      enum: [preparing, shipping, delivered]
      description: 상품 준비 중(preparing), 배송 중(shipping), 배송 완료(delivered)
    Delivery:
      type: object
      required: [id, recipient, item, status, updatedAt]
      properties:
        id:
          type: string
          description: 운송장 번호
        recipient:
          type: string
          description: 받는 사람
        item:
          type: string
          description: 보내는 상품
        status:
          $ref: '#/components/schemas/DeliveryStatus'
        updatedAt:
          type: string
          format: date-time
          description: 마지막으로 바뀐 시각. 이보다 오래된 이벤트는 캐시에 반영하지 않는다.
    MemberRole:
      type: string
      enum: [admin, editor, viewer]
    Member:
      type: object
      required: [id, name, email, role, joinedAt]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          $ref: '#/components/schemas/MemberRole'
        joinedAt:
          type: string
          format: date
          description: 가입일(YYYY-MM-DD)
    MemberPage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Member'
        total:
          type: integer
          description: 거른 뒤의 전체 회원 수
        page:
          type: integer
        pageSize:
          type: integer
    CatalogProduct:
      type: object
      required: [id, name, summary, description, price, stock]
      properties:
        id:
          type: integer
        name:
          type: string
        summary:
          type: string
          description: 목록에 보이는 한 줄 소개
        description:
          type: string
          description: 상세에 보이는 설명
        price:
          type: integer
          minimum: 0
          description: 원 단위 가격
        stock:
          type: integer
          minimum: 0
          description: 남은 재고. 0이면 품절이다.
    Cart:
      type: object
      required: [id, items, totalQuantity, totalPrice]
      properties:
        id:
          type: string
          description: 장바구니의 id. 손님의 장바구니도 이 id만으로 찾으므로 백엔드는 추측할 수 없는 값(UUID 등)을 쓴다.
        items:
          type: array
          description: 담긴 상품. 처음 담은 순서대로다.
          items:
            $ref: '#/components/schemas/CartItem'
        totalQuantity:
          type: integer
          minimum: 0
          description: 담긴 상품 수량의 합
        totalPrice:
          type: integer
          minimum: 0
          description: 담긴 상품 금액(가격 × 수량)의 합. 원 단위다.
    CartItem:
      type: object
      required: [productId, name, price, quantity]
      properties:
        productId:
          type: integer
        name:
          type: string
        price:
          type: integer
          minimum: 0
          description: 지금 가격. 원 단위다.
        quantity:
          type: integer
          minimum: 1
          maximum: 99
    NewCartItem:
      type: object
      required: [productId, quantity]
      properties:
        productId:
          type: integer
        quantity:
          type: integer
          minimum: 1
          maximum: 99
          title: 수량
    CartItemUpdate:
      type: object
      required: [quantity]
      properties:
        quantity:
          type: integer
          minimum: 1
          maximum: 99
          title: 수량
    ShopError:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: 사람이 읽을 수 있는 실패 이유
    PaymentMethod:
      type: string
      enum: [card, transfer, mobile]
      description: 신용·체크카드(card), 계좌이체(transfer), 휴대폰 결제(mobile)
    OrderStatus:
      type: string
      enum: [pending, paid]
      description: 결제 대기(pending), 결제 완료(paid)
    NewOrder:
      type: object
      required: [cartId, recipient, phone, postalCode, address, paymentMethod, agreedToPurchase]
      properties:
        cartId:
          type: string
          description: 주문할 장바구니의 id
        # 1단계: 배송 정보
        recipient:
          type: string
          title: 받는 사람
          minLength: 1
          maxLength: 20
        phone:
          type: string
          title: 연락처
          description: 010-0000-0000 형식으로 적습니다.
          pattern: '^01\d-\d{3,4}-\d{4}$'
          example: 010-1234-5678
        postalCode:
          type: string
          title: 우편번호
          description: 다섯 자리 숫자로 적습니다.
          pattern: '^\d{5}$'
          example: '04524'
        address:
          type: string
          title: 주소
          minLength: 1
          maxLength: 100
        addressDetail:
          type: string
          title: 상세 주소
          maxLength: 100
        deliveryMemo:
          type: string
          title: 배송 메모
          maxLength: 50
        # 2단계: 결제 수단
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
          title: 결제 수단
        # 3단계: 주문 확인
        agreedToPurchase:
          type: boolean
          title: 주문 내용을 확인했고 결제에 동의합니다
          const: true
    Order:
      type: object
      required: [id, status, items, totalQuantity, totalPrice, recipient, phone, postalCode, address, paymentMethod]
      properties:
        id:
          type: string
          description: 주문 번호. 손님의 주문도 이 번호로 찾으므로 백엔드는 추측하기 어려운 값을 쓰고, 실제로는 주문한 사람인지도 확인한다.
        status:
          $ref: '#/components/schemas/OrderStatus'
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        totalQuantity:
          type: integer
          minimum: 1
        totalPrice:
          type: integer
          minimum: 0
          description: 결제할 금액. 원 단위다.
        recipient:
          type: string
        phone:
          type: string
        postalCode:
          type: string
        address:
          type: string
        addressDetail:
          type: string
        deliveryMemo:
          type: string
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
    OrderItem:
      type: object
      required: [productId, name, price, quantity]
      properties:
        productId:
          type: integer
        name:
          type: string
          description: 주문한 때의 상품 이름
        price:
          type: integer
          minimum: 0
          description: 주문한 때의 가격. 원 단위다.
        quantity:
          type: integer
          minimum: 1
    OrderPayment:
      type: object
      required: [paymentKey, amount]
      properties:
        paymentKey:
          type: string
          description: 결제창이 돌려준 결제 키. 실제 PG는 이 키로 결제를 승인한다.
        amount:
          type: integer
          minimum: 0
          description: 결제창에서 승인한 금액. 백엔드가 주문 금액과 같은지 확인한다.
    UserStatus:
      type: string
      enum: [active, invited, suspended]
      description: 활성(active), 초대만 하고 아직 로그인하지 않음(invited), 정지(suspended)
    UserAccount:
      type: object
      required: [id, name, email, role, status, joinedAt]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'
        status:
          $ref: '#/components/schemas/UserStatus'
        department:
          type: string
          description: 소속 부서. 없으면 비운다.
        joinedAt:
          type: string
          format: date
          description: 추가한 날(YYYY-MM-DD)
    NewUserAccount:
      type: object
      required: [name, email, role]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 40
          title: 이름
        email:
          type: string
          format: email
          title: 이메일
        role:
          $ref: '#/components/schemas/Role'
        department:
          type: string
          maxLength: 40
          title: 부서
    UserAccountUpdate:
      type: object
      required: [name, email, role, status]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 40
          title: 이름
        email:
          type: string
          format: email
          title: 이메일
        role:
          $ref: '#/components/schemas/Role'
        status:
          $ref: '#/components/schemas/UserStatus'
        department:
          type: string
          maxLength: 40
          title: 부서
    UserAccountPage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserAccount'
        total:
          type: integer
          description: 거른 뒤의 전체 사용자 수
        page:
          type: integer
        pageSize:
          type: integer
    UserStats:
      type: object
      required: [total, byStatus, byRole]
      properties:
        total:
          type: integer
          minimum: 0
          description: 전체 사용자 수
        byStatus:
          type: array
          description: 상태별 사용자 수. 모든 상태가 한 번씩 UserStatus의 순서대로 온다.
          items:
            $ref: '#/components/schemas/UserStatusCount'
        byRole:
          type: array
          description: 역할별 사용자 수. 모든 역할이 한 번씩 Role의 순서대로 온다.
          items:
            $ref: '#/components/schemas/UserRoleCount'
    UserStatusCount:
      type: object
      required: [status, count]
      properties:
        status:
          $ref: '#/components/schemas/UserStatus'
        count:
          type: integer
          minimum: 0
    UserRoleCount:
      type: object
      required: [role, count]
      properties:
        role:
          $ref: '#/components/schemas/Role'
        count:
          type: integer
          minimum: 0
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    CartId:
      name: cartId
      in: path
      required: true
      description: 장바구니의 id(createCart가 돌려준 값)
      schema:
        type: string
    CartProductId:
      name: productId
      in: path
      required: true
      description: 장바구니에 담긴 상품의 id
      schema:
        type: integer
    OrderId:
      name: orderId
      in: path
      required: true
      description: 주문 번호
      schema:
        type: string
