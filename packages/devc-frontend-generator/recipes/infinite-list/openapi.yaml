# infinite-list Recipe가 Base 명세에 더하는 명세 조각(docs/recipes.md의 "OpenAPI 명세 조각"). 페이지 번호를 받아 게시글 한
# 페이지를 배열로 돌려주는 목록 operation과, 번호형 페이지네이션이 페이지 수를 정할 때 쓰는 전체 개수 operation이다.
# 무한 스크롤 목록은 listArticles의 infiniteQueryOptions로, 번호형 페이지네이션은 listArticles의 queryOptions와
# countArticles로 같은 게시글을 보여 준다(src/features/article-list).
tags:
  - name: articles
    description: 게시글
paths:
  /articles:
    get:
      operationId: listArticles
      summary: 게시글 목록
      description: 최근에 올린 글부터 한 페이지를 돌려준다. 마지막 페이지 뒤의 페이지를 요청하면 빈 배열을 돌려준다.
      tags: [articles]
      parameters:
        - name: page
          in: query
          description: 1부터 세는 페이지 번호
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          description: 한 페이지의 게시글 수
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        '200':
          description: 게시글 한 페이지. 마지막 페이지 뒤이면 빈 배열이다.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Article'
              # 생성된 MSW 핸들러가 돌려주는 값. 개발·테스트에서는 infinite-list Recipe의 핸들러
              # (src/shared/mocks/articles.ts)가 페이지 번호대로 나눈 페이지를 대신 돌려준다.
              example:
                - id: 46
                  title: 릴리스 노트 46호
                  summary: 2024년 11월 13일에 올린 릴리스 노트입니다.
                  publishedAt: '2024-11-13'
                - id: 45
                  title: 개발 블로그 45호
                  summary: 2024년 11월 6일에 올린 개발 블로그입니다.
                  publishedAt: '2024-11-06'
        '400':
          description: 파라미터가 잘못되었다.
  /articles/count:
    get:
      operationId: countArticles
      summary: 게시글 수
      description: 전체 게시글 수를 돌려준다. 번호형 페이지네이션이 페이지 수를 정할 때 쓴다.
      tags: [articles]
      responses:
        '200':
          description: 전체 게시글 수
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleCount'
              example:
                total: 46
components:
  schemas:
    Article:
      type: object
      required: [id, title, summary, publishedAt]
      properties:
        id:
          type: integer
        title:
          type: string
        summary:
          type: string
        publishedAt:
          type: string
          format: date
          description: 올린 날(YYYY-MM-DD)
    ArticleCount:
      type: object
      required: [total]
      properties:
        total:
          type: integer
          minimum: 0
