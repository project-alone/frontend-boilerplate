# optimistic-update Recipe가 Base 명세에 더하는 명세 조각(docs/recipes.md의 "OpenAPI 명세 조각"). 할 일 목록과, 할 일
# 하나의 완료 여부를 바꾸는 operation이다. 할 일 목록(src/features/todo-list)은 완료 여부를 바꾸면 응답을 기다리지 않고
# 목록 쿼리(listTodos)의 캐시를 먼저 고친다(낙관적 업데이트).
tags:
  - name: todos
    description: 할 일
paths:
  /todos:
    get:
      operationId: listTodos
      summary: 할 일 목록
      description: 할 일을 만든 순서(id 오름차순)로 모두 돌려준다.
      tags: [todos]
      responses:
        '200':
          description: 할 일 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Todo'
              # 생성된 MSW 핸들러가 돌려주는 값. 개발·테스트에서는 optimistic-update Recipe의 핸들러(src/shared/mocks/todos.ts)가
              # 바뀐 완료 여부를 기억해 대신 돌려준다.
              example:
                - id: 1
                  title: 디자인 시안 검토하기
                  done: true
                - id: 2
                  title: 회의록 공유하기
                  done: false
                - id: 3
                  title: 배포 일정 정하기
                  done: false
                - id: 4
                  title: 보안 점검 결과 승인하기(보안 담당자만 바꿀 수 있음)
                  done: false
  /todos/{todoId}:
    patch:
      operationId: updateTodo
      summary: 할 일 고치기
      description: 보낸 항목만 바꾸고 바뀐 할 일을 돌려준다. 바꿀 권한이 없는 할 일이면 403으로 거절한다.
      tags: [todos]
      parameters:
        - name: todoId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TodoUpdate'
      responses:
        '200':
          description: 바뀐 할 일
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
              example:
                id: 2
                title: 회의록 공유하기
                done: true
        '400':
          description: 요청 본문이 잘못되었다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoError'
        '403':
          description: 이 할 일을 바꿀 권한이 없다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoError'
              example:
                message: 보안 점검 결과는 보안 담당자만 승인할 수 있습니다.
        '404':
          description: 할 일이 없다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoError'
components:
  schemas:
    Todo:
      type: object
      required: [id, title, done]
      properties:
        id:
          type: integer
        title:
          type: string
        done:
          type: boolean
          description: 끝냈는지
    TodoUpdate:
      type: object
      required: [done]
      properties:
        done:
          type: boolean
          description: 끝냈는지
    TodoError:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: 사람이 읽을 수 있는 실패 이유
