# 랜딩 Archetype이 Base 명세에 더하는 명세 조각(docs/archetypes.md). 마케팅 랜딩 페이지의 콘텐츠를 locale마다 돌려주는
# 콘텐츠 operation이다. 헤드리스 CMS처럼 페이지의 문구(검색 결과에 보일 제목·설명, 히어로, 주요 기능, 고객 후기, 자주 묻는
# 질문)는 백엔드가 관리하고, 앱은 빌드할 때 locale마다 가져와 페이지를 미리 렌더링한다(SSG). 다른 Archetype의 스키마와
# 이름이 겹치지 않도록 스키마는 Landing으로 시작한다.
tags:
  - name: landing
    description: 랜딩 페이지 콘텐츠
paths:
  /landing-pages/{locale}:
    get:
      operationId: getLandingPage
      summary: 랜딩 페이지 콘텐츠
      description: locale로 쓴 랜딩 페이지의 문구를 돌려준다. 그 locale로 쓴 콘텐츠가 없으면 404다.
      tags: [landing]
      parameters:
        - name: locale
          in: path
          required: true
          description: 콘텐츠의 언어(앱의 locale. 예 ko, en)
          schema:
            type: string
      responses:
        '200':
          description: 랜딩 페이지 콘텐츠
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LandingPageContent'
              # 생성된 MSW 핸들러가 돌려주는 값(ko). 개발·테스트에서는 랜딩의 핸들러(src/shared/mocks/landing.ts)가 locale마다
              # 다른 콘텐츠를 대신 돌려준다.
              example:
                title: Starter로 시작하는 프론트엔드 프로젝트
                description: 명령 하나로 엄격한 TypeScript, 테스트, 접근성 검사, CI를 갖춘 프론트엔드 프로젝트를 만듭니다.
                hero:
                  heading: 첫 커밋부터 깨끗한 프론트엔드 프로젝트
                  body: Starter는 팀이 검증한 설정과 패턴으로 새 프로젝트를 만듭니다. 초기 설정 대신 화면을 만드는 데 시간을 쓰세요.
                  callToAction:
                    label: 주요 기능 보기
                    href: '#features'
                features:
                  heading: 주요 기능
                  items:
                    - id: setup
                      title: 명령 하나로 시작
                      body: 만든 직후부터 타입 검사, 린트, 테스트, 빌드가 통과하는 프로젝트를 만듭니다.
                testimonials:
                  heading: 먼저 써 본 팀의 이야기
                  items:
                    - id: first-day
                      quote: 프로젝트를 만든 첫날부터 화면 개발을 시작했습니다.
                      author: 김하늘
                      role: 프론트엔드 리드
                faqs:
                  heading: 자주 묻는 질문
                  items:
                    - id: backend
                      question: 백엔드가 준비되지 않았어도 개발할 수 있나요?
                      answer: 네. OpenAPI 명세에서 만든 목 응답으로 화면을 먼저 만들고, 백엔드가 준비되면 주소만 바꿉니다.
        '404':
          description: 그 locale로 쓴 콘텐츠가 없다.
components:
  schemas:
    LandingPageContent:
      type: object
      required: [title, description, hero, features, testimonials, faqs]
      properties:
        title:
          type: string
          description: 페이지 제목. 브라우저 탭, 검색 결과, 공유 카드에 보인다.
        description:
          type: string
          description: 페이지 설명. 검색 결과와 공유 카드에 보인다.
        hero:
          $ref: '#/components/schemas/LandingHero'
        features:
          $ref: '#/components/schemas/LandingFeatureSection'
        testimonials:
          $ref: '#/components/schemas/LandingTestimonialSection'
        faqs:
          $ref: '#/components/schemas/LandingFaqSection'
    LandingHero:
      type: object
      description: 페이지 맨 위의 큰 제목과 소개, 행동 유도 링크
      required: [heading, body, callToAction]
      properties:
        heading:
          type: string
        body:
          type: string
        callToAction:
          $ref: '#/components/schemas/LandingCallToAction'
    LandingCallToAction:
      type: object
      required: [label, href]
      properties:
        label:
          type: string
        href:
          type: string
          description: 옮겨 갈 주소. 페이지 안의 위치(#features)나 절대 주소(https://...)다.
    LandingFeatureSection:
      type: object
      required: [heading, items]
      properties:
        heading:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/LandingFeature'
    LandingFeature:
      type: object
      required: [id, title, body]
      properties:
        id:
          type: string
        title:
          type: string
        body:
          type: string
    LandingTestimonialSection:
      type: object
      required: [heading, items]
      properties:
        heading:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/LandingTestimonial'
    LandingTestimonial:
      type: object
      required: [id, quote, author, role]
      properties:
        id:
          type: string
        quote:
          type: string
          description: 고객이 한 말
        author:
          type: string
          description: 말한 사람의 이름
        role:
          type: string
          description: 말한 사람의 직책
    LandingFaqSection:
      type: object
      required: [heading, items]
      properties:
        heading:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/LandingFaq'
    LandingFaq:
      type: object
      required: [id, question, answer]
      properties:
        id:
          type: string
        question:
          type: string
        answer:
          type: string
